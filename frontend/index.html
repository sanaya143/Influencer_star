<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zylo — Fashion for every you</title>
    <meta name="description" content="Zylo: affordable, trend-led fashion for every age, gender and occasion." />
    <meta name="theme-color" content="#01ABDD" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        // Keep preferences, bag and wishlist saved before the Zylo rebrand.
        ['theme', 'motion', 'bag', 'wishlist'].forEach(function (k) {
          var old = localStorage.getItem('threadora.' + k);
          if (old !== null && localStorage.getItem('zylo.' + k) === null) localStorage.setItem('zylo.' + k, old);
          localStorage.removeItem('threadora.' + k);
        });
        // Apply the saved theme before first paint (no light flash in dark mode).
        var t = localStorage.getItem('zylo.theme');
        if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        var m = localStorage.getItem('zylo.motion');
        if (m === 'on' || m === 'off') document.documentElement.classList.add('motion-' + m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
